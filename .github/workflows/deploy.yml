name: Deploy Lambda

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Lambda Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies into package directory
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --target ./package --no-cache-dir

      - name: Build zip artifact
        run: |
          mkdir -p dist

          # Copy installed dependencies (flat at zip root)
          cd package
          zip -r ../dist/lambda.zip . -x "*.pyc" -x "*/__pycache__/*"
          cd ..

          # Add lambda_handler.py at zip root
          zip -j dist/lambda.zip lambda_handler.py

          # Add the app/ package tree at zip root (so import app.main works)
          zip -r dist/lambda.zip app/ -x "*.pyc" -x "*/__pycache__/*"

          # Optionally add public/ static assets if present
          if [ -d public ]; then
            zip -r dist/lambda.zip public/ -x "*.pyc" -x "*/__pycache__/*"
          fi

          echo "Zip contents (top-level):"
          unzip -l dist/lambda.zip | head -50

      - name: Upload zip to S3
        run: |
          aws s3 cp dist/lambda.zip \
            s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.PROJECT_NAME }}/lambda.zip \
            --region ${{ secrets.AWS_REGION }}

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: dist/lambda.zip
          retention-days: 7

  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="tf_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -var="lambda_zip_key=${{ secrets.PROJECT_NAME }}/lambda.zip" \
            -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture Function URL
        id: get_url
        working-directory: terraform
        run: |
          FUNCTION_URL=$(terraform output -raw function_url)
          echo "FUNCTION_URL=${FUNCTION_URL}" >> $GITHUB_ENV
          echo "function_url=${FUNCTION_URL}" >> $GITHUB_OUTPUT
          echo "Deployed to: ${FUNCTION_URL}"

      - name: Self-verify - health check
        run: |-
          FUNCTION_URL="${{ env.FUNCTION_URL }}"
          # Strip trailing slash for consistency
          FUNCTION_URL="${FUNCTION_URL%/}"
          echo "Checking health at: ${FUNCTION_URL}/health"

          MAX_RETRIES=10
          RETRY_DELAY=10
          HTTP_STATUS=0

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /tmp/health_response.txt -w "%{http_code}" \
              --max-time 30 \
              "${FUNCTION_URL}/health" || echo "000")

            echo "Attempt ${i}/${MAX_RETRIES} - HTTP status: ${HTTP_STATUS}"
            cat /tmp/health_response.txt || true

            if [[ "$HTTP_STATUS" =~ ^[23] ]]; then
              echo "Health check passed with status ${HTTP_STATUS}"
              break
            fi

            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          if [[ ! "$HTTP_STATUS" =~ ^[23] ]]; then
            echo "ERROR: Health check failed after ${MAX_RETRIES} attempts. Last status: ${HTTP_STATUS}"
            cat /tmp/health_response.txt || true
            exit 1
          fi
